<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-azul">

        <div class="container-fluid ">

            <!-- mudar a fonte? -->

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <!-- Deixar ativo? Verificar depois -->
                    <li class="nav-item me-3">
                        <a class="nav-link active text-white" aria-current="page" href="#">Salas</a>
                    </li>

                    <li class="nav-item me-3">
                        <a class="nav-link text-white" href="#">Agendar</a>

                    <li class="nav-item me-3">
                        <a class="nav-link text-white" href="#">Buscar</a>
                    </li>

                    <!-- Está em dropdown, verificar se podemos fazer alguma coisa com ele -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white me-3" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Meus Agendamentos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item text-dark" href="#">Item 1</a></li>
                            <li><a class="dropdown-item text-dark" href="#">Item 2</a></li>

                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-dark" href="#">Item 3</a></li>

                    </li>
                </ul>
                <span class="me-2 navbar-text ms-auto fw-semibold text-white">Olá, Usuário</span>

                <img class="" src="../images/icons8-lembrete-de-compromissos-24.png" alt="">

                </ul>

            </div>

    </nav>

    <div class="container">

        <div class="mt-2">

            <h2>Salas Agendadas</h2>
            <!-- Adicione dentro do <div class="container"> ou onde preferir -->
            <div class="row justify-content-center mt-4">
                <div class="col-12 col-md-12 col-lg-12 bg-white border rounded shadow p-4">
                    <form>
                        <div class="row g-2">
                            <div class="col">
                                <label for="codigo" class="form-label fw-bold">Código</label>
                                <input type="text" class="form-control form-control-sm" id="codigo"
                                    placeholder="Digite o código">
                            </div>

                            <div class="col">
                                <label for="de" class="form-label fw-bold">De</label>
                                <input type="time" class="form-control form-control-sm" id="de">
                            </div>
                            <div class="col">
                                <label for="ate" class="form-label fw-bold">Até</label>
                                <input type="time" class="form-control form-control-sm" id="ate">
                            </div>

                            <div class="row g-2">
                                <div class="col">
                                    <label for="bloco" class="form-label fw-bold">Bloco</label>
                                    <input type="text" class="form-control form-control-sm" id="bloco"
                                        placeholder="Digite o bloco">
                                </div>
                                <div class="col">
                                    <label for="status" class="form-label fw-bold">Status</label>
                                    <select class="form-select form-select-sm" id="status">
                                        <option value="">Selecione</option>
                                        <option value="agendado">Agendado</option>
                                        <option value="livre">Livre</option>
                                        <option value="ocupado">Ocupado</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <div class="col-12">
                                        <label for="pesquisa" class="form-label fw-bold">Pesquisar</label>
                                        <input type="text" class="form-control form-control-sm" id="pesquisa"
                                            placeholder="Digite para pesquisar...">
                                    </div>
                                </div>

                            </div>
                        </div>
                    </form>
                </div>
            </div>


        </div>


    </div>









</body>

</html>
