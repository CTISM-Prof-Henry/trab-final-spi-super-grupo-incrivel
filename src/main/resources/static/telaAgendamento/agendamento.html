<div class="container">
    <div class="mt-2">

        <div class="row justify-content-center">
            <div class="col-12 col-md-12 col-lg-12">
                <h2 class="mt-2 text-start">Agendar uma sala</h2>
            </div>
        </div>

        <div class="row justify-content-center">
            <h6 class=" mt-1 col-12 col-md-12 col-lg-12 bg-azul border rounded shadow p-2 text-white fw-bold">
                Filtros</h6>
            <div class="col-12 col-md-12 col-lg-12 bg-white border rounded shadow p-4">
                <!-- Form agora tem id para JS -->
                <form id="agendaForm">
                    <div class="row g-2">
                        <div class="col">
                            <div class="row g-2 align-items-end">
                                <div class="col">
                                    <label for="sala" class="form-label fw-bold">Sala</label>
                                    <select class="form-select form-select-sm" id="sala" required>
                                        <option value="">Selecione uma sala</option>
                                        <!-- preenchido dinamicamente -->
                                    </select>
                                </div>

                                <div class="col">
                                    <label for="bloco" class="form-label fw-bold">Bloco</label>
                                    <select class="form-select form-select-sm" id="bloco">
                                        <option value="">Selecione</option>
                                        <option value="A">A</option>
                                        <option value="B">B</option>
                                        <option value="C">C</option>
                                    </select>
                                </div>

                                <div class="col-3">
                                    <label for="de" class="form-label fw-bold ">De</label>
                                    <input type="time" class="form-control form-control-sm " id="de" required>
                                </div>

                                <div class="col-3">
                                    <label for="ate" class="form-label fw-bold">Até</label>
                                    <input type="time" class="form-control form-control-sm " id="ate" required>
                                </div>
                            </div>

                        <div class="row g-2 ">
                            <div class="col">
                                <label for="dias" class="form-label fw-bold">Dia</label>
                                <input type="date" class="form-control form-control-sm w-25" id="dias" name="dias" required>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <button type="button" id="cancelBtn" class="btn cinza btn-sm">Cancelar</button>
                                <button type="submit" id="submitBtn" class="btn bg-azul btn-sm">Solicitar</button>
                            </div>

                        </div>
                    </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de agendamentos -->
        <div class="row mt-4">
            <div class="col-12">
                <h5>Agendamentos</h5>
                <div class="table-responsive">
                    <table class="table table-striped" id="agendasTable">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>De</th>
                                <th>Até</th>
                                <th>Sala</th>
                                <th>Bloco</th>
                                <th>Usuário</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="agendasBody">
                            <!-- preenchido por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

</div>
</div>

<script src="../js/init-user.js"></script>
<script src="./script-agendamento.js"></script>
