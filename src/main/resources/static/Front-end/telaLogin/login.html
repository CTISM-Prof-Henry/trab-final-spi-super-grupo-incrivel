<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<nav class="navbar">
    <div class="container-fluid d-flex justify-content-end">
        <!-- botão de mudar o tema -->

        <button id="toggleTheme" class="btn btn-outline-dark ms-auto border-2 cinza fw-bold" style="border-color: #fff;">Tema</button>
    </div>
</nav>


    <div class="container-fluid" id="main-content">



        <div class="row min-vh-100">
            <div class="col-12 col-md-6 p-3 p-md-0">
                <!-- esquerda -->
                <div class="d-flex align-items-center justify-content-center h-100">
                    <img src="../images/Politeecnico_Brasaao_horizontal_positivo.svg" 
                         class="img-fluid" 
                         alt="Logo do Politécnico" 
                         style="width: 100%; max-width: 450px; height: auto;" />
                </div>
            </div>
            <!-- Linha divisória vertical -->
            <div class="d-none d-md-block position-absolute" style="left: 50%; top: 10%; bottom: 30%; width: 5px; border-left: 4px solid #005287; background: none; transform: translateX(-50%);"></div>

            <div class="col-12 col-md-6 p-3 p-md-0">
                <!-- direita -->
                <div class="d-flex align-items-center justify-content-center h-100 mt-4">

                    <!-- colocar algum efeito de sombra? shadow-lg -->
                    <div class="card border-2 cinza" style="width: 100%; max-width: 420px; border-color: #fff;">
                        <div class="card-body p-5">
                            
                            <form>
                                <div class="mb-2">
                                    <label for="usuario" class="form-label fw-bold">Usuário</label>
                                    <input type="text" class="form-control form-control-lg" id="usuario" placeholder="Usuário" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">Senha</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Senha" required>
                                        <button class="btn" type="button" id="togglePassword" style="border: 1px solid #ced4da; border-left: none; background-color: #fff; color: #6c757d;">
                                            <i class="fas fa-eye" id="eyeIcon"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="mb-2 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Lembrar identificação de usuário
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold"><a href="../html/pagina-inicial.html" class="text-white text-decoration-none">Entrar</a></button>

                                <!-- Perguntar depois se é uma boa colocar 'Esqueceu sua senha?' -->
                                <!-- <div class="text-center">
                                    <a href="#" class="text-decoration-none">Esqueceu sua senha?</a>
                                </div> -->
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
    <!-- Footer -->
    <footer class="bg-azul text-white py-3 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-1">
                    <h2>UFSM</h2>
                </div>
            </div>
        </div>
    </footer>
        </div>
    </div>


    <script src="./script.js"></script>
</body>

</html>
