    <div class="container">

            <div class="row justify-content-center">
                <div class="col-12 col-md-12 col-lg-12">

                </div>

            <!-- quadrado do filtro -->
            <!-- "SIIIIIIIIIIIIIIIIII" - Cristiano Ronaldo -->
            <div class="row justify-content-center">
                <h6 class=" mt-1 col-12 col-md-12 col-lg-12 bg-azul border rounded shadow p-2 text-white fw-bold">
                    Filtros</h6>
                <div class="col-12 col-md-12 col-lg-12 bg-white border rounded shadow p-4">
                    <form>
                        <div class="row g-2">
                            <div class="col">
                                <label for="codigo" class="form-label fw-bold ">Código</label>
                                <input type="text" class="form-control form-control-sm" id="codigo"
                                    placeholder="Digite o código">
                            </div>

                            <div class="col">
                                <label for="de" class="form-label fw-bold ">De</label>
                                <input type="time" class="form-control form-control-sm libertinusKeyboardRegular fs-5"
                                    id="de">
                            </div>
                            <div class="col">
                                <label for="ate" class="form-label fw-bold">Até</label>
                                <input type="time" class="form-control form-control-sm libertinusKeyboardRegular fs-5"
                                    id="ate">
                            </div>

                            <div class="row g-2">
                                <div class="col">
                                    <label for="bloco" class="form-label fw-bold">Bloco</label>
                                    <input type="text" class="form-control form-control-sm" id="bloco"
                                        placeholder="Digite o bloco">
                                </div>
                                <div class="col">
                                    <label for="status" class="form-label fw-bold">Status</label>
                                    <select class="form-select form-select-sm" id="status">
                                        <option value="">Selecione</option>
                                        <option value="agendado">Agendado</option>
                                        <option value="livre">Livre</option>
                                        <option value="ocupado">Ocupado</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <div class="col-12">
                                        <label for="pesquisa" class="form-label fw-bold">Pesquisar</label>
                                        <input type="text" class="form-control form-control-sm" id="pesquisa"
                                            placeholder="Digite para pesquisar...">
                                    </div>
                                </div>

                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- fim do quadrado do filtro. Mas a história ainda não acabou... -->

            <div class="row justify-content-center">

                <h6 class=" mt-5 col-12 col-md-12 col-lg-12 bg-azul border rounded shadow p-2 text-white fw-bold">Lista

                                <th scope="col">Data</th>
                                <th scope="col">Descrição</th>
                                <th scope="col">Solicitante</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody id="salasBody">
                            <!-- preenchido por JS -->
                        </tbody>
                    </table>
