<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<nav class="navbar">
    <div class="container-fluid d-flex justify-content-end">
        <!-- botão de mudar o tema -->

        <button id="toggleTheme" class="btn btn-outline-dark ms-auto border-2 cinza fw-bold" style="border-color: #fff;">Tema</button>
    </div>
</nav>


    <div class="container-fluid" id="main-content">



        <div class="row min-vh-100">
            <div class="col-12 col-md-6 p-3 p-md-0">
                <!-- esquerda -->
                <div class="d-flex align-items-center justify-content-center h-100">
                    <img src="../imagens/Politeecnico_Brasaao_horizontal_positivo.svg" 
                         class="img-fluid" 
                         alt="Logo do Politécnico" 
                         style="width: 100%; max-width: 450px; height: auto;" />
                </div>
            </div>
            <!-- Linha divisória vertical -->
            <div class="d-none d-md-block position-absolute" style="left: 50%; top: 10%; bottom: 30%; width: 5px; border-left: 4px solid #005287; background: none; transform: translateX(-50%);"></div>

            <div class="col-12 col-md-6 p-3 p-md-0">
                <!-- direita -->
                <div class="d-flex align-items-center justify-content-center h-100 mt-4">

                    <!-- colocar algum efeito de sombra? shadow-lg -->
                    <div class="card border-2 cinza" style="width: 100%; max-width: 420px; border-color: #fff;">
                        <div class="card-body p-5">
                            
                            <form id="loginForm">
                                <div class="mb-2">
                                    <label for="usuario" class="form-label fw-bold">Usuário</label>
                                    <input type="text" class="form-control form-control-lg" id="usuario" placeholder="Usuário" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">Senha</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Senha" required>
                                        <button class="btn" type="button" id="togglePassword" style="border: 1px solid #ced4da; border-left: none; background-color: #fff; color: #6c757d;">
                                            <i class="fas fa-eye" id="eyeIcon"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="mb-2 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Lembrar identificação de usuário
                                    </label>
                                </div>

                                <!-- botão agora submete por JS e salva o usuário -->
                                <button id="loginBtn" type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Entrar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
    <!-- Footer -->
    <footer class="bg-azul text-white py-3 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-1">
                    <h2>UFSM</h2>
                </div>
            </div>
        </div>
    </footer>
        </div>
    </div>


    <script src="../js/init-user.js"></script>
    <script src="./script.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function () {
  const APP_BASE = '/sistema_agendamento_poli';
  const form = document.getElementById('loginForm');
  if (!form) return;

  async function fetchCreatedUser(resp, identificador, APP_BASE) {
    try {
      // se o response já tiver JSON no body, usa
      const ct = resp.headers.get('Content-Type') || '';
      if (ct.includes('application/json')) {
        return await resp.json();
      }
      // se Location presente, busca o recurso criado
      const loc = resp.headers.get('Location');
      if (loc) {
        const url = loc.startsWith('http') ? loc : `${APP_BASE}${loc.startsWith('/') ? '' : '/'}${loc}`;
        const getResp = await fetch(url);
        if (getResp.ok) return await getResp.json();
      }
    } catch (e) {
      console.error('Erro ao obter usuário criado (body/Location):', e);
    }

    // fallback: sempre tentar buscar pelo identificador
    try {
      const lookup = await fetch(`${APP_BASE}/usuarios/busca/identificador/${encodeURIComponent(identificador)}`);
      if (lookup.ok) return await lookup.json();
    } catch (e) {
      console.error('Erro no lookup por identificador:', e);
    }

    return null;
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const identificador = document.getElementById('usuario')?.value?.trim() || '';
    const senha = document.getElementById('password')?.value || '';
    const remember = !!document.getElementById('remember')?.checked;

    if (!identificador || !senha) {
      alert('Informe usuário e senha.');
      return;
    }

    const dto = {
      nome: identificador,
      telefone: '',
      email: `${identificador}@example.com`,
      identificador: identificador,
      senha: senha
    };

    try {
      // tenta criar (se já existir, controller pode retornar 4xx)
      let resp = await fetch(`${APP_BASE}/usuarios`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dto)
      });

      let usuarioObj = null;
      // usa a função que lida com body/Location/fallback
      usuarioObj = await fetchCreatedUser(resp, identificador, APP_BASE);

      // se criação falhou e fetchCreatedUser não recuperou, tenta lookup direto
      if (!usuarioObj) {
        const lookup = await fetch(`${APP_BASE}/usuarios/busca/identificador/${encodeURIComponent(identificador)}`);
        if (lookup.ok) usuarioObj = await lookup.json();
      }

      if (!usuarioObj) {
        alert('Não foi possível criar ou recuperar o usuário.');
        return;
      }

      const id = usuarioObj.id ?? (Array.isArray(usuarioObj) && usuarioObj[0]?.id) ?? null;
      const nome = usuarioObj.nome ?? identificador;

      if (window.setCurrentUser) {
        window.setCurrentUser({ id: id, username: nome }, remember);
      } else {
        if (remember) {
          localStorage.setItem('username', nome);
          if (id !== null) localStorage.setItem('userId', String(id));
        } else {
          sessionStorage.setItem('username', nome);
          if (id !== null) sessionStorage.setItem('userId', String(id));
        }
      }

      window.location.href = `${APP_BASE}/geral/pagina-inicial.html`;
    } catch (err) {
      console.error('Erro no login:', err);
      alert('Erro ao conectar com o backend.');
    }
  });
});
</script>
</body>
</html>
